<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline — Lazy Panda</title>
  <style>
    :root { --bg: #121214; --text: #f0f0f2; --text3: #9090a8; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    .offline-container { padding: 40px 20px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: var(--text3); font-size: 15px; margin: 0 0 24px; line-height: 1.5; }
    .btn { background: #7c6ff7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: #6b5ce6; }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="icon">🐼💤</div>
    <h1>You're offline</h1>
    <p>We couldn't connect to the network.<br>Don't worry, your schedule is safe on your device.</p>
    <a href="./index.html" class="btn">Try Again</a>
  </div>
</body>
</html>
